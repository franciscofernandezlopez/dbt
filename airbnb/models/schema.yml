version: 2

models:
  - name: dim_hosts_cleansed
    description: Cleansed tables containing Airbnb hosts.
    config: 
      contract:
        enforced: true

    columns:
    - name: host_id
      description: Primary key for the host
      data_type: integer
      data_tests:
        - unique
        - not_null
      constraints:
        - type: primary_key
        - type: not_null

    - name: host_name
      description: Host name
      data_type: string
      data_tests:
        - not_null
      constraints:
        - type: not_null

    - name: is_superhost
      description: Is superhost (t = true, f = false)
      data_type: string
      data_tests:
        - accepted_values:
            arguments:
              values: ['t', 'f']
    
    - name: created_at
      data_type: timestamp

    - name: updated_at
      data_type: timestamp

  - name: dim_listings_cleansed
    description: Cleansed tables which contains Airbnb listings.
    data_tests:
      - minimum_row_count:
          arguments: 
            min_row_count: 1000

    columns: 
      - name: listing_id
        description: PK for the listing
        data_tests:
          - unique 
          - not_null

      - name: host_id
        description: Host ID
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: Type of the apartment / room
        data_tests: 
          - accepted_values: 
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']
      
      - name: minimum_nights
        data_tests:
          - positive_values

  - name: fct_reviews
    columns: 
      - name: listing_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id

      - name: review_sentiment
        data_tests: 
          - accepted_values: 
              arguments:
                values: ['positive', 'neutral', 'negative']

      - name: reviewer_name
        data_tests:
          - not_null